<!-- Defines the HTML layout for the 3D globe, its visual overlays,
the click instruction, and the popup interface. -->
  <div class="page">
	 <div class="title">click to add a pointer</div>
    <div class="globe-wrapper">
        <canvas id="globe-3d"></canvas>
        <canvas id="globe-2d-overlay"></canvas>
        <div id="globe-popup-overlay">
            <div class="globe-popup"></div>
        </div>
    </div>
</div>

<!-- 
Fragment Shader for the 3D Globe Map:
- Samples the Earth's map texture to obtain RGB colors.
- Uses UV coordinates to determine which part of the map to display.
- Adjusts the color intensity based on the distance from the center of each point.
- Creates circular dots using the smoothstep() function.
- Discards pixels outside the specified circular boundary.
- Controls the transparency of each dot using vOpacity.
- Outputs the final color and opacity for rendering through WebGL.

Purpose: Creates the textured, dotted appearance of the 3D globe.
-->
<script type="x-shader/x-fragment" id="fragment-shader-map">
    uniform sampler2D u_map_tex;

    varying float vOpacity;
    varying vec2 vUv;

    void main() {
        vec3 color = texture2D(u_map_tex, vUv).rgb;
        color -= .2 * length(gl_PointCoord.xy - vec2(.5));
        float dot = 1. - smoothstep(.38, .4, length(gl_PointCoord.xy - vec2(.5)));
        if (dot < 0.5) discard;
        gl_FragColor = vec4(color, dot * vOpacity);
    }
</script>


<!--
Vertex Shader for the 3D Globe Map:
- Reads the Earth's map texture to determine which points should be visible.
- Sets the size of each point based on the map visibility and u_dot_size.
- Calculates the opacity of points based on their position relative to the camera,
  helping make points on the back of the globe appear more transparent.
- Tracks the time elapsed since the user clicked to create a ripple effect.
- Calculates the ripple's distance, amplitude, and damping over time.
- Creates an expanding ripple effect around the user's pointer position.
- Adjusts the position of each point to simulate the ripple animation.
- Transforms the 3D point positions into screen coordinates using the
  model-view and projection matrices.

Purpose: Controls the positions, sizes, visibility, opacity, and ripple
animation of points that form the 3D globe.
-->

<script type="x-shader/x-vertex" id="vertex-shader-map">
    uniform sampler2D u_map_tex;
    uniform float u_dot_size;
    uniform float u_time_since_click;
    uniform vec3 u_pointer;

    #define PI 3.14159265359

    varying float vOpacity;
    varying vec2 vUv;

    void main() {

        vUv = uv;

        // mask with world map
        float visibility = step(.2, texture2D(u_map_tex, uv).r);
        gl_PointSize = visibility * u_dot_size;

        // make back dots semi-transparent
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        vOpacity = (1. / length(mvPosition.xyz) - .7);
        vOpacity = clamp(vOpacity, .03, 1.);

        // add ripple
        float t = u_time_since_click - .1;
        t = max(0., t);
        float max_amp = .15;
        float dist = 1. - .5 * length(position - u_pointer); // 0 .. 1
        float damping = 1. / (1. + 20. * t); // 1 .. 0
        float delta = max_amp * damping * sin(5. * t * (1. + 2. * dist) - PI);
        delta *= 1. - smoothstep(.8, 1., dist);
        vec3 pos = position;
        pos *= (1. + delta);

        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.);
    }
</script>

<!--
External Libraries and JavaScript Module:
- Loads the GSAP (GreenSock Animation Platform) library from a CDN.
- GSAP is used to create smooth animations, transitions, and motion effects.
- Loads the local script.js file as an ES module using type="module".
- script.js contains the main JavaScript logic for the 3D globe,
  including its rendering, animation, and user interactions.

Purpose: Imports the GSAP animation library and the project's main
JavaScript module to make the 3D globe interactive and animated.
-->
    <script src='https://unpkg.com/gsap@3/dist/gsap.min.js'></script>
    <script type="module" src="./script.js"></script>

  </body>
